# 飯能市・日高市・入間市・毛呂山町が共有する CMS 系統。製品名は未特定。
# id は指紋 (feed.php?siteNew=) 由来の仮 id。製品名が判明したら aliases に足す (id は変えない)。
id: fam-feedphp-sitenew
aliases: []
product: null
version: null
observed_at: null
evidence: null
min_signals: 2
signals:
  - /cgi-bin/feed.php?siteNew=
  - /index.update.json
  - /news_list.html
  - /theme/base/js/mutual_switching/
  - /resource/js/foot_print.js
  - "<!-- CMS編集領域ここから -->"
feed_patterns:
  - path: "/cgi-bin/feed.php?siteNew=1&displayCount={n}&displayRange={days}&includeShortcut={0|1}"
    format: RSS 1.0 (RDF)
    date_field: dc:date
sync_kind: append
reachability:
  overseas_rest: unknown   # 未観測。「遮断なし」(not_blocked) ではない
# 4 自治体は同等ではない。根拠の強さは evidence を読むこと。
measured_representatives:
  - handle: hanno
    observed_at: "2026-10-12"
    evidence: "トップページ HTML (Internet Archive 2026-10-12 のスナップショット) と、/resource/js/foot_print.js の直接取得"
    signals_seen:
      - /cgi-bin/feed.php?siteNew=
      - /news_list.html
      - /theme/base/js/mutual_switching/
      - /index.update.json
      - /resource/js/foot_print.js
  - handle: iruma
    observed_at: "2026-10-23"
    evidence: "トップページ HTML の実地取得"
    signals_seen:
      - /cgi-bin/feed.php?siteNew=
      - /news_list.html
