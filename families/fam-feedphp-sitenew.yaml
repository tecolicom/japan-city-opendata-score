    # min_signals: 2 を満たすのは、feed.php が 502 を返す (= エンドポイントが存在する) ことを 1 本と数えた場合に限る。
    evidence: "トップページ HTML の実地取得。加えて /cgi-bin/feed.php?siteNew=... が 502 を返す (= エンドポイントが存在する。非該当の tokorozawa / sayama / chichibu は 404)"
    signals_seen:
      - /theme/base/js/mutual_switching/
      - /cgi-bin/feed.php?siteNew=
