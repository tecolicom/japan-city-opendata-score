# 基本編 14 + 応用編 8。標準に無い領域は standard_dataset: null の拡張として足す。
# profile: static | dynamic | null。null は「未判定」(static の省略形ではない)。
#   値を持つのは実測に着手した領域 (schedule-events, gomi) だけ。
# publishers_expected: 値を持つ領域にのみ置く。配信元として想定する主体の種別。
