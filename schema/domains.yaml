# 情報領域の語彙 (正典)。
# 骨格はデジタル庁「自治体標準オープンデータセット」(旧 推奨データセット) の
# 基本編 14 + 応用編 8。標準に無い領域は standard_dataset: null の拡張として足す。
# profile: static = 更新頻度が低い / dynamic = 継続的に更新される。
# publishers_expected: その領域の配信元として想定する主体の種別。
domains:
